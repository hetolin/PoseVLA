# Omni3D 数据集配置
# 基于 DetAny3D 的 pickle 格式

# ============================================================
# 图像参数
# ============================================================
image_size: 224              # 最终输出图像尺寸
vggt_image_size: 518         # VGGT 图像尺寸
img_history_size: 1          # 历史图像帧数（通常为 1）
num_cameras: 3               # 多相机数量（固定为 3，用于格式统一）

enable_random_crop: true  # true=随机crop（数据增强），false=确定性中心crop（默认，保持向后兼容）

# 摄像头配置（用于模拟多视角）
camera_configs:
  - name: "top_head"
    crop_scale: [0.90, 1.0]
    aspect_ratio: [1.33, 1.33]
  - name: "hand_left"
    crop_scale: [0.25, 0.55]
    aspect_ratio: [1.33, 1.33]
  - name: "hand_right"
    crop_scale: [0.25, 0.55]
    aspect_ratio: [1.33, 1.33]

# 数据加载选项
max_retries: 100

# ============================================================
# 路径替换配置（用于跨机器迁移 pkl 数据）
# ============================================================
# pkl 中存储的旧路径前缀 → 替换为新的 data_root
# 例如 pkl 中 img_path = "/home/tione/.../omni3d_dataset/datasets/objectron/train/xxx.jpg"
# 替换后 img_path = "/home/hetolin/datasets/omni3d_dataset/datasets/objectron/train/xxx.jpg"
old_data_root: "/home/tione/notebook/workspace/shanejhuang/omni3d_dataset"
data_root: "/home/hetolin/datasets/omni3d_dataset"

depth_full_prob: ${depth_full_prob}
depth_sparse_prob: ${depth_sparse_prob}
ray_prob: ${ray_prob}
neg_prob: ${neg_prob}
# ============================================================
# 数据集模式
# ============================================================
mode: "train"                # 数据集模式: "train" 或 "val"

# ============================================================
# 调试选项
# ============================================================
debug: false                 # 是否开启调试模式（打印详细错误信息）

# ============================================================
# 数据集配置
# ============================================================
# dataset.train 和 dataset.val 定义实际的数据集
# 每个数据集是一个字典，包含以下字段：
#   - pkl_path: pickle 文件路径（必需）
#   - metric_scale: 深度度量缩放因子（可选，默认 1.0）
#   - max_distance: 最大深度距离，单位米（可选）
#   - min_distance: 最小深度距离，单位米（可选）
#   - vggt_resolution: VGGT 图像分辨率（可选，默认 518）

