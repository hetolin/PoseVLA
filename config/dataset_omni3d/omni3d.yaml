# ============================================================
# 使用示例
# ============================================================
# 在 base_joint_training.yaml 中添加：
#
# defaults:
#   - dataset_omni3d: omni3d
#
# 这将加载所有6个训练数据集：
#   - objectron: 移动设备AR场景
#   - arkitscenes: 室内AR场景
#   - nuscenes: 室外自动驾驶场景
#   - hypersim: 合成室内场景
#   - kitti: 室外驾驶场景
#   - sunrgbd: 室内RGB-D场景
#
# 如果只想使用部分数据集，可以注释掉不需要的数据集配置

# ============================================================
# 数据格式说明
# ============================================================
# Pickle 文件格式（DetAny3D 格式）:
#
# List[Dict] 每个字典包含：
#   - img_path: str                    # 图像路径
#   - depth_path: str (可选)           # 深度图路径（.png 或 .npy）
#   - K: np.ndarray (3, 3)             # 相机内参矩阵
#   - category_groups: Dict[int, List[Dict]]  # 按类别分组的目标
#
# 每个目标对象包含：
#   - 3d_bbox: [x, y, z, w, h, l, yaw]  # 3D 边界框参数
#   - 2d_bbox_proj: [x1, y1, x2, y2]    # 2D 投影边界框（可选）
#   - rotation_pose: np.ndarray (3, 3)  # 旋转矩阵（可选）
#   - label: int                         # 类别 ID
#   - label_name: str                    # 类别名称

# ============================================================
# 深度图处理
# ============================================================
# 支持的深度图格式：
#   - .png: 使用 metric_scale 转换为米
#   - .npy: 直接加载（假设已经是米单位）
#
# 如果没有深度图，将创建全零深度图
