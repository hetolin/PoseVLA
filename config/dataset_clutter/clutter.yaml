# 摄像头配置（用于模拟多视角）
camera_configs:
  - name: "top_head"
    crop_scale: [0.90, 1.0]
    aspect_ratio: [1.33, 1.33]
  - name: "hand_left"
    crop_scale: [0.25, 0.55]
    aspect_ratio: [1.33, 1.33]
  - name: "hand_right"
    crop_scale: [0.25, 0.55]
    aspect_ratio: [1.33, 1.33]
# 缓存配置
use_cache: true
cache_index_path: "./cache/bop_index.json"  # 多数据集会自动创建 bop_index_ycbv.json, bop_index_hb.json 等

use_preprocessed_grasps: True
preprocessed_grasps_dir: "/home/tione/notebook/workspace/shanejhuang/pi0_3d_new/cache/filtered_grasps_v2"


# Grasp 数据加载配置（适用于 GraspClutter6D）
load_grasps: False  # 是否加载抓取数据
grasp_format: "6d"  # 抓取格式：6d
fric_coef_thresh: 0.4  # 摩擦系数阈值
remove_invisible_grasps: True  # 是否移除不可见的抓取
max_grasps_per_object: 1  # 每个物体最多保留的 grasp 数量（推荐：50-200）
grasp_selection_mode: "top-k"  # grasp 选择模式: "top-k"（按分数）或 "random"（随机）
use_grasp_prob: 0.0

# 性能优化选项
max_sample_points: 100  # 限制每个物体的采样点数量（null=不限制，推荐：30-50 用于加速训练）
                         # 示例：50 可减少 50% 计算量，30 可减少 70% 计算量

depth_full_prob: ${depth_full_prob}
depth_sparse_prob: ${depth_sparse_prob}
ray_prob: ${ray_prob}
neg_prob: ${neg_prob}
# # 场景过滤（可选）
# scene_ids: null  # null 表示使用所有场景，或指定列表 [0, 1, 2, ...]

