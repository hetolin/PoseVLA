# 摄像头配置（用于模拟多视角）
camera_configs:
  - name: "top_head"
    crop_scale: [0.90, 1.0]
    aspect_ratio: [1.33, 1.33]
  - name: "hand_left"
    crop_scale: [0.15, 0.65]
    aspect_ratio: [1.33, 1.33]
  - name: "hand_right"
    crop_scale: [0.15, 0.65]
    aspect_ratio: [1.33, 1.33]

# 缓存配置
use_cache: true
cache_index_path: "./cache/bop_index.json"  # 多数据集会自动创建 bop_index_ycbv.json, bop_index_hb.json 等
cache_category_path: ""
# # 场景过滤（可选）
# scene_ids: null  # null 表示使用所有场景，或指定列表 [0, 1, 2, ...]

