# BOP 数据集配置
# 支持多数据集加载：ycbv, hb, lm, hot3d, tudl, icbin, hope, handal 等
# 参数从 bop_toolkit/configs/train.yaml 迁移而来

# 数据集根目录列表（按顺序对应下面的 id2name）
data_root:
  - "/home/hetolin/datasets/bop/ycbv"
  - "/home/hetolin/datasets/bop/hb"
  - "/home/hetolin/datasets/bop/lm"
  - "/home/hetolin/datasets/bop/hot3d"
  - "/home/hetolin/datasets/bop/tudl"
  - "/home/hetolin/datasets/bop/icbin"
  - "/home/hetolin/datasets/bop/hope"
  - "/home/hetolin/datasets/bop/handal"

# 数据集划分
split: "test"  # "train_pbr" or "train" or "test"

# 图像分辨率
image_size: 224
vggt_image_size: 518
img_history_size: 1
num_cameras: 3

# Crop 模式配置
enable_random_crop: true  # true=随机crop（数据增强），false=确定性中心crop（默认，保持向后兼容）

# 深度处理参数
depth_max_percentile: 99.0
depth_min_percentile: 1.0
depth_max_value: 100.0  # 最大深度距离（米）
min_distance: 0.1       # 最小深度距离（米）
metric_scale: 1.0       # 度量缩放因子
unit_scale: 1000.0      # 单位转换：mm->m (1000.0) 或 0.1mm->m (10000.0)

# 数据加载选项
load_depth: true
load_masks: false
load_gt: true
max_samples: null  # null表示加载所有样本
max_retries: 10

depth_full_prob: ${depth_full_prob}
depth_sparse_prob: ${depth_sparse_prob}
ray_prob: ${ray_prob}
neg_prob: ${neg_prob}
